<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>post.js demo</title>
    <!-- Serve the meanwhile-dev folder (python3 -m http.server) and open /examples/post-demo.html.
         ?post=0 shows the same frame without effects; ?t=3 picks the time. -->
    <script type="importmap">
      { "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "postprocessing": "https://cdn.jsdelivr.net/npm/postprocessing@6.35.5/build/index.js"
      } }
    </script>
    <style>html, body { margin: 0; background: #111; } canvas { display: block; width: 540px; height: 960px; }</style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script type="module">
      import * as THREE from 'three';
      import { createPost } from '../assets/post.js';

      const W = 1080, H = 1920;
      const q = new URLSearchParams(location.search);
      const canvas = document.getElementById('c');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#0d4d4d');
      const camera = new THREE.PerspectiveCamera(35, W / H, 0.1, 100);
      camera.position.set(0, 1.2, 6);
      camera.lookAt(0, 0.6, -2);
      scene.add(new THREE.HemisphereLight('#ffffff', '#335', 1.2));
      const sun = new THREE.DirectionalLight('#fff', 2); sun.position.set(3, 5, 4); scene.add(sun);

      const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: '#2a6b5f' }));
      floor.rotation.x = -Math.PI / 2; scene.add(floor);
      // stand-ins: dust balls receding into the distance, Dev in the middle, one glowing pollen grain
      for (let i = 0; i < 9; i++) {
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.35, 32, 16), new THREE.MeshStandardMaterial({ color: '#d8c8a8' }));
        m.position.set((i % 2 ? 1 : -1) * 1.1, 0.35, 3 - i * 2.2); scene.add(m);
      }
      const dev = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.6, 8, 16), new THREE.MeshStandardMaterial({ color: '#f08a24' }));
      dev.position.set(0, 0.6, -1.5); scene.add(dev);
      const pollen = new THREE.Mesh(new THREE.IcosahedronGeometry(0.25, 2), new THREE.MeshStandardMaterial({ color: '#ffd23f', emissive: '#ffb800', emissiveIntensity: 4 }));
      pollen.position.set(0.9, 1.4, -4); scene.add(pollen);

      const post = q.get('post') === '0' ? null : createPost(renderer, scene, camera, {
        // rack focus: Dev for the first 2 s, then pull to the pollen grain
        dof: { focus: (t) => ({ target: t < 2 ? dev : pollen, range: 0.6, bokeh: 10 }) },
        bloom: { intensity: 0.8 },
        chroma: { amount: (t) => 0.001 + 0.002 * Math.max(0, Math.sin(t * 3)) },
      });

      window.renderAt = (t) => {
        dev.rotation.y = t * 0.8;
        post ? post.render(t) : renderer.render(scene, camera);
      };
      window.renderAt(Number(q.get('t') ?? 1));
      window.ready = true;
    </script>
  </body>
</html>
